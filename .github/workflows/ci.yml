name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test the workspace
        run: cargo test --workspace --locked

      - name: Build the desktop app
        run: cargo build -p zim-app --release --locked

      - name: Launch the desktop app under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y xvfb xdotool mesa-vulkan-drivers libvulkan1
          xvfb-run -a bash scripts/smoke-desktop.sh target/release/zim-app

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install dependency checks
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked

      - name: Check licenses, advisories, bans, and sources
        run: cargo deny --locked check licenses advisories bans sources

      - name: Audit the committed lockfile
        run: cargo audit
