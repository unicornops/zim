[package]
name = "zim-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Zim desktop instant messaging client"
repository = "https://github.com/unicornops/zim"

[dependencies]
zim-desktop = { path = "crates/zim-desktop" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "UnicornOps <noreply@unicornops.ie>"
copyright = "2026, UnicornOps"
license-file = ["LICENSE", "0"]
depends = "$auto, libfontconfig1, libfreetype6, libvulkan1 | libegl1"
extended-description = "Zim is a person-first desktop messaging project built with Rust and GPUI. This preview contains the desktop shell."
section = "net"
priority = "optional"
assets = [
    ["target/release/zim-app", "usr/bin/", "755"],
    ["packaging/linux/ie.unicornops.zim.desktop", "usr/share/applications/", "644"],
    ["licenses/GPUI-Apache-2.0.txt", "usr/share/doc/zim-app/GPUI-Apache-2.0.txt", "644"],
]

[lints]
workspace = true

[workspace]
members = ["crates/zim-desktop", "crates/zim-adapter-slack"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2", default-features = false, features = ["font-kit", "wayland", "x11"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Cargo does not inherit patches from a dependency's workspace. Keep GPUI's
# executor and Linux event loop on the same revisions as the pinned Zed tag.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
