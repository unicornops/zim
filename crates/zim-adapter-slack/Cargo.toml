[package]
name = "zim-adapter-slack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Workspace-scoped Slack messaging adapter for Rust applications"
repository = "https://github.com/unicornops/zim"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6.5"

[lints]
workspace = true
