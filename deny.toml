[graph]
all-features = true

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained paste is used by metal in GPUI's macOS backend" },
    { id = "RUSTSEC-2026-0192", reason = "Unmaintained ttf-parser is part of GPUI's font stack" },
    { id = "RUSTSEC-2026-0206", reason = "Unmaintained rustybuzz is part of GPUI's font stack" },
    { id = "RUSTSEC-2026-0370", reason = "GPUI's AT-SPI stack still uses zvariant separately from zbus" },
    { id = "RUSTSEC-2026-0371", reason = "GPUI's AT-SPI stack still uses zbus_names separately from zbus" },
    { id = "RUSTSEC-2026-0372", reason = "GPUI's AT-SPI stack still uses zvariant_derive separately from zbus" },
    { id = "RUSTSEC-2026-0543", reason = "Unmaintained chrono is required by this revision of GPUI" },
]

[licenses]
version = 2
allow = [
    "GPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/proptest-rs/proptest",
    "https://github.com/smol-rs/async-task.git",
    "https://github.com/zed-industries/calloop",
]
